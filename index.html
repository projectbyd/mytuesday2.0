<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>My Tuesday — Kehidupan yang Sedang Aku Bangun</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#F6F1EA;
  --paper-soft:#FBF8F4;
  --ink:#2D2438;
  --ink-mute:#7A7086;
  --line:#E4DACB;

  --c0:#E4A339;
  --c1:#C65A6B;
  --c2:#8B4B6B;
  --c3:#3D3466;

  --accent:#C65A6B;
  --accent-soft:#C65A6B22;

  --shadow:
    0 1px 2px rgba(45,36,56,.04),
    0 6px 20px rgba(45,36,56,.06);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Karla',sans-serif;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;
}

input,
textarea,
button{
  font-family:inherit;
}

button{
  -webkit-appearance:none;
}

.app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  padding-bottom:56px;
}

/* =========================================================
   HOME
========================================================= */

.home-hero{
  padding:38px 22px 22px;
  position:relative;
  overflow:hidden;
}

.home-hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    #FBF8F4 0%,
    var(--paper) 100%
  );
  z-index:-1;
}

.eyebrow{
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink-mute);
  font-weight:600;
  margin:0 0 10px;
}

.hero-title{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:40px;
  line-height:1.02;
  margin:0 0 6px;
  letter-spacing:-.01em;
}

.hero-sub{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:16px;
  color:var(--ink-mute);
  margin:0 0 18px;
  line-height:1.4;
}

.hero-quote{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-size:14.5px;
  line-height:1.6;
  color:var(--ink);
  border-left:2px solid var(--accent);
  padding-left:14px;
  margin:0 0 20px;
}

.hero-quote span{
  display:block;
  color:var(--ink-mute);
}

.progress-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:4px;
}

.progress-track{
  flex:1;
  height:5px;
  border-radius:4px;
  background:var(--line);
  overflow:hidden;
}

.progress-fill{
  height:100%;
  border-radius:4px;
  background:
    linear-gradient(
      90deg,
      var(--c0),
      var(--c1),
      var(--c2),
      var(--c3)
    );
  width:0%;
  transition:width .5s ease;
}

.progress-label{
  font-size:12px;
  color:var(--ink-mute);
  font-weight:600;
  white-space:nowrap;
}

.arc-strip{
  display:flex;
  gap:3px;
  padding:0 22px 6px;
  margin-top:14px;
}

.arc-dot{
  flex:1;
  height:4px;
  border-radius:3px;
  opacity:.55;
}

.folder-list{
  padding:6px 16px 30px;
}

.folder-card{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--paper-soft);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:10px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.folder-card:hover{
  box-shadow:var(--shadow);
}

.folder-card:active{
  transform:scale(.985);
}

.folder-card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--accent);
}

.folder-num{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:26px;
  color:var(--accent);
  min-width:40px;
  flex-shrink:0;
}

.folder-body{
  flex:1;
  min-width:0;
}

.folder-title{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:15.5px;
  line-height:1.25;
  margin:0 0 3px;
}

.folder-sub{
  font-size:12px;
  color:var(--ink-mute);
  margin:0 0 8px;
  line-height:1.35;
}

.folder-progress{
  height:3px;
  background:var(--line);
  border-radius:3px;
  overflow:hidden;
}

.folder-progress i{
  display:block;
  height:100%;
  background:var(--accent);
  width:0%;
  transition:width .4s ease;
}

.folder-chev{
  color:var(--ink-mute);
  font-size:18px;
  flex-shrink:0;
}

.folder-photo-badge{
  font-size:10.5px;
  color:var(--accent);
  font-weight:700;
  margin-left:6px;
}

.backup-row{
  display:flex;
  gap:10px;
  padding:0 22px;
  margin-top:4px;
}

.backup-btn{
  flex:1;
  padding:11px 10px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--paper-soft);
  color:var(--ink);
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
}

.backup-btn:active{
  transform:scale(.98);
}

#importFile{
  display:none;
}

.privacy-note{
  font-size:11px;
  color:var(--ink-mute);
  text-align:center;
  padding:12px 30px 0;
  line-height:1.5;
  margin:0;
}

.pdf-row{
  padding:0 22px;
  margin-top:10px;
}

.pdf-btn{
  width:100%;
  padding:13px 10px;
  border-radius:12px;
  border:none;
  background:var(--ink);
  color:var(--paper-soft);
  font-size:13.5px;
  font-weight:700;
  cursor:pointer;
  letter-spacing:.01em;
}

.pdf-btn:active{
  transform:scale(.98);
}

.home-footer{
  text-align:center;
  padding:20px 30px 40px;
  font-family:'Fraunces',serif;
  font-style:italic;
  font-size:13.5px;
  color:var(--ink-mute);
  line-height:1.6;
}

/* =========================================================
   DETAIL
========================================================= */

.detail{
  position:fixed;
  inset:0;
  background:var(--paper);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  display:none;
  z-index:30;
}

.detail.open{
  display:block;
}

.detail-inner{
  max-width:560px;
  margin:0 auto;
  padding-bottom:70px;
}

.detail-header{
  position:sticky;
  top:0;
  z-index:5;
  background:
    linear-gradient(
      180deg,
      var(--paper) 70%,
      transparent
    );
  padding:16px 16px 10px;
  display:flex;
  align-items:center;
  gap:12px;
}

.back-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--paper-soft);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  color:var(--ink);
  cursor:pointer;
  flex-shrink:0;
}

.back-btn:active{
  transform:scale(.92);
}

.save-toast{
  font-size:11.5px;
  color:var(--accent);
  font-weight:700;
  opacity:0;
  transition:opacity .3s ease;
  letter-spacing:.02em;
}

.save-toast.show{
  opacity:1;
}

.detail-hero{
  padding:6px 22px 22px;
}

.detail-num{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:15px;
  color:var(--accent);
  margin-bottom:6px;
}

.detail-title{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:28px;
  line-height:1.08;
  margin:0 0 8px;
}

.detail-sub{
  font-size:13.5px;
  color:var(--ink-mute);
  line-height:1.5;
  margin:0;
}

.section{
  padding:0 22px 26px;
}

.field{
  margin-bottom:20px;
}

.field-label{
  font-size:13.5px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:8px;
  line-height:1.4;
  display:block;
}

.field input[type=text],
.field textarea{
  width:100%;
  border:1px solid var(--line);
  background:var(--paper-soft);
  border-radius:12px;
  padding:12px 14px;
  font-size:16px;
  color:var(--ink);
  font-family:'Karla',sans-serif;
  resize:vertical;
  transition:border-color .15s ease;
}

.field input[type=text]:focus,
.field textarea:focus{
  outline:none;
  border-color:var(--accent);
}

.field textarea{
  min-height:64px;
  line-height:1.5;
}

.field textarea.big{
  min-height:120px;
}

.field textarea.letter{
  min-height:110px;
  font-family:'Fraunces',serif;
  font-style:italic;
  font-size:15.5px;
}

.money-wrap{
  position:relative;
}

.money-wrap span{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  font-size:15px;
  color:var(--ink-mute);
  font-weight:600;
}

.money-wrap input{
  padding-left:38px !important;
}

.check-grid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:10px;
}

.chip{
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--line);
  background:var(--paper-soft);
  border-radius:20px;
  padding:8px 13px;
  font-size:13px;
  cursor:pointer;
  color:var(--ink-mute);
  transition:.15s ease;
}

.chip input{
  display:none;
}

.chip .dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--line);
  flex-shrink:0;
  transition:.15s ease;
}

.chip.checked{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--ink);
  font-weight:600;
}

.chip.checked .dot{
  background:var(--accent);
}

.other-input{
  margin-top:2px;
}

.list-items{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.list-item{
  display:flex;
  align-items:center;
  gap:10px;
}

.list-item .li-num{
  font-family:'Fraunces',serif;
  font-style:italic;
  color:var(--accent);
  font-size:15px;
  width:18px;
  flex-shrink:0;
  text-align:right;
}

.list-item input{
  flex:1;
}

.timeline-slot{
  display:flex;
  gap:14px;
  padding:14px 0;
  border-bottom:1px dashed var(--line);
}

.timeline-slot:last-child{
  border-bottom:none;
}

.tl-time{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:600;
  font-size:15px;
  color:var(--accent);
  width:52px;
  flex-shrink:0;
  padding-top:10px;
}

.tl-input{
  flex:1;
}

/* =========================================================
   VIEW / EDIT
========================================================= */

.field-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

.field-head .field-label{
  margin:0;
  flex:1;
}

.edit-btn{
  border:1px solid var(--line);
  background:var(--paper-soft);
  color:var(--accent);
  border-radius:999px;
  padding:5px 10px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
}

.edit-btn:active,
.save-btn:active,
.cancel-btn:active{
  transform:scale(.97);
}

.answer-view{
  background:var(--paper-soft);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  min-height:46px;
  font-size:15px;
  line-height:1.5;
  color:var(--ink);
  white-space:pre-wrap;
}

.answer-view.empty{
  color:var(--ink-mute);
  font-style:italic;
  font-size:13px;
}

.answer-checks{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.answer-chip{
  border:1px solid var(--accent);
  background:var(--accent-soft);
  border-radius:20px;
  padding:7px 11px;
  font-size:12.5px;
  color:var(--ink);
}

.edit-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:8px;
}

.save-btn,
.cancel-btn{
  border-radius:9px;
  padding:8px 12px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

.save-btn{
  border:1px solid var(--accent);
  background:var(--accent);
  color:#fff;
}

.cancel-btn{
  border:1px solid var(--line);
  background:var(--paper-soft);
  color:var(--ink-mute);
}

.timeline-slot .field-head{
  margin-bottom:8px;
}

.timeline-slot .answer-view{
  min-height:42px;
}

/* =========================================================
   GALLERY
========================================================= */

.gallery-label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.gal-item{
  position:relative;
  aspect-ratio:1/1;
  border-radius:10px;
  overflow:hidden;
  background:var(--paper-soft);
  border:1px solid var(--line);
}

.gal-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.gal-del{
  position:absolute;
  top:4px;
  right:4px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:rgba(45,36,56,.72);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  border:none;
  cursor:pointer;
}

.gal-add{
  aspect-ratio:1/1;
  border-radius:10px;
  border:1.5px dashed var(--line);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:var(--ink-mute);
  font-size:11px;
  cursor:pointer;
  background:var(--paper-soft);
  text-align:center;
  padding:6px;
}

.gal-add span{
  font-size:20px;
  color:var(--accent);
  line-height:1;
}

input[type=file]{
  display:none;
}

/* =========================================================
   CORE
========================================================= */

.core-static{
  margin-top:6px;
  padding:20px;
  border-radius:16px;
  background:
    linear-gradient(
      160deg,
      var(--accent-soft),
      transparent
    );
  border:1px solid var(--line);
}

.core-static h4{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-size:16px;
  margin:0 0 12px;
  color:var(--ink);
}

.core-item{
  margin-bottom:12px;
}

.core-item b{
  display:block;
  font-size:11.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:2px;
}

.core-item span{
  font-size:13.5px;
  color:var(--ink);
  line-height:1.4;
}

.core-final{
  font-family:'Fraunces',serif;
  font-style:italic;
  font-size:14.5px;
  text-align:center;
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid var(--line);
  color:var(--ink);
}

/* =========================================================
   DANGER
========================================================= */

.danger-zone{
  padding:10px 22px 40px;
  text-align:center;
}

.danger-btn{
  background:none;
  border:none;
  color:var(--ink-mute);
  font-size:12px;
  text-decoration:underline;
  cursor:pointer;
  padding:8px;
}

/* =========================================================
   PRINT / PDF
========================================================= */

.print-sheet{
  display:none;
}

@media print{

  body{
    background:#fff;
  }

  body > *:not(.print-sheet){
    display:none !important;
  }

  .print-sheet{
    display:block !important;
    position:absolute;
    left:0;
    top:0;
    width:100%;
    margin:0;
    padding:0;
    background:#fff;
  }

  @page{
    size:A4;
    margin:17mm 16mm 18mm;
  }

  .story-cover{
    min-height:250mm;
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    page-break-after:always;
  }

  .story-cover-eyebrow{
    font-family:'Karla',sans-serif;
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
    font-weight:700;
    color:#8B4B6B;
    margin-bottom:18px;
  }

  .story-cover h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:39px;
    line-height:1.05;
    color:#2D2438;
    margin:0 auto 12px;
    max-width:500px;
  }

  .story-cover h2{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:18px;
    color:#7A7086;
    margin:0 0 30px;
  }

  .story-cover-line{
    width:70px;
    height:2px;
    margin:0 auto 25px;
    background:#C65A6B;
  }

  .story-cover-quote{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:15px;
    line-height:1.75;
    color:#3D3466;
    max-width:390px;
    margin:0 auto;
  }

  .story-cover-date{
    margin-top:45px;
    font-family:'Karla',sans-serif;
    font-size:10px;
    color:#9A91A0;
    letter-spacing:.08em;
  }

  .story-chapter{
    page-break-before:always;
    padding-top:8mm;
  }

  .story-chapter:first-of-type{
    page-break-before:auto;
  }

  .story-chapter-head{
    margin-bottom:22px;
    border-bottom:1px solid #E4DACB;
    padding-bottom:12px;
  }

  .story-chapter-number{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:12px;
    font-weight:500;
    color:#C65A6B;
    margin-bottom:4px;
  }

  .story-chapter-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:25px;
    line-height:1.1;
    color:#2D2438;
    margin:0 0 5px;
  }

  .story-chapter-sub{
    font-family:'Karla',sans-serif;
    font-size:11px;
    color:#7A7086;
  }

  .story-text{
    font-family:'Karla',sans-serif;
    font-size:13.5px;
    line-height:1.72;
    color:#2D2438;
  }

  .story-text p{
    margin:0 0 13px;
  }

  .story-text p:last-child{
    margin-bottom:0;
  }

  .story-dropcap:first-letter{
    font-family:'Fraunces',serif;
    font-size:40px;
    float:left;
    line-height:.8;
    padding-right:5px;
    padding-top:5px;
    color:#C65A6B;
  }

  .story-image-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:20px;
  }

  .story-image-grid img{
    width:105px;
    height:105px;
    object-fit:cover;
    border-radius:7px;
  }

  .story-quote{
    margin:22px 0;
    padding:14px 18px;
    border-left:2px solid #C65A6B;
    background:#FBF8F4;
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:15px;
    line-height:1.6;
    color:#3D3466;
  }

  .timeline-story{
    margin-top:4px;
  }

  .timeline-story-row{
    display:flex;
    gap:15px;
    padding:9px 0;
    border-bottom:1px dashed #E4DACB;
  }

  .timeline-story-time{
    width:45px;
    flex-shrink:0;
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    font-size:12px;
    color:#8B4B6B;
  }

  .timeline-story-text{
    flex:1;
    font-family:'Karla',sans-serif;
    font-size:12.5px;
    line-height:1.5;
    color:#2D2438;
  }

  .core-print{
    margin-top:25px;
    padding:18px;
    border:1px solid #E4DACB;
    background:#FBF8F4;
    border-radius:10px;
  }

  .core-print-title{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:17px;
    margin:0 0 14px;
  }

  .core-print-item{

/* =========================================================

========================================================= */

function hexToRgb(h){
  h=h.replace('#','');

  return [
    parseInt(h.substr(0,2),16),
    parseInt(h.substr(2,2),16),
    parseInt(h.substr(4,2),16)
  ];
}

function rgbToHex(r,g,b){
  return '#'+[
    r,g,b
  ].map(v =>
    Math.round(v)
      .toString(16)
      .padStart(2,'0')
  ).join('');
}

function lerpColor(a,b,t){

  const A=hexToRgb(a);
  const B=hexToRgb(b);

  return rgbToHex(
    A[0]+(B[0]-A[0])*t,
    A[1]+(B[1]-A[1])*t,
    A[2]+(B[2]-A[2])*t
  );
}

function accentFor(idx,total){

  const stops=[
    '#E4A339',
    '#C65A6B',
    '#8B4B6B',
    '#3D3466'
  ];

  const t=idx/(total-1);

  const seg=t*(stops.length-1);

  const i=Math.min(
    Math.floor(seg),
    stops.length-2
  );

  const localT=seg-i;

  return lerpColor(
    stops[i],
    stops[i+1],
    localT
  );
}

/* =========================================================
   STATE
========================================================= */

const state={
  data:{},
  loaded:false,
  editing:{}
};

let currentCat=null;

function emptyData(){

  return {
    values:{},
    checks:{},
    images:[]
  };

}


/* =========================================================
   STORAGE
========================================================= */

function storageGet(key){

  try{

    const raw=localStorage.getItem(key);

    return raw
      ? JSON.parse(raw)
      : null;

  }catch(e){

    return null;

  }

}

function storageSet(key,obj){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(obj)
    );

    return true;

  }catch(e){

    console.error('Storage error',e);

    return false;

  }

}

function storageDelete(key){

  try{
    localStorage.removeItem(key);
  }catch(e){}

}

function storageAllCatKeys(){

  try{

    return Object.keys(localStorage)
      .filter(k=>k.startsWith('cat:'));

  }catch(e){

    return [];

  }

}

async function loadAll(){

  const existingKeys=storageAllCatKeys();

  CATS.forEach(cat=>{

    const key='cat:'+cat.id;

    if(existingKeys.includes(key)){

      const v=storageGet(key);

      state.data[cat.id]=v || emptyData();

    }else{

      state.data[cat.id]=emptyData();

    }

  });

  state.loaded=true;

}


/* =========================================================
   EDITING
========================================================= */

function editKey(catId,key){
  return catId+'::'+key;
}

function beginEdit(catId,key){

  if(!state.editing[catId]){
    state.editing[catId]={};
  }

  const d=state.data[catId];

  const cat=CATS.find(c=>c.id===catId);

  const field=cat && cat.fields
    ? cat.fields.find(f=>f.k===key)
    : null;

  const draft={
    value:d.values[key] || '',
    check:null
  };

  if(field && field.t==='list'){

    draft.list={};

    for(let i=0;i<field.n;i++){

      draft.list[
        field.k+'__'+i
      ] =
        d.values[
          field.k+'__'+i
        ] || '';

    }

  }

  if(d.checks[key]){

    draft.check=
      JSON.parse(
        JSON.stringify(
          d.checks[key]
        )
      );

  }

  state.editing[catId][key]=draft;

  renderDetail(cat);

}

function cancelEdit(catId,key){

  if(state.editing[catId]){
    delete state.editing[catId][key];
  }

  renderDetail(
    CATS.find(c=>c.id===catId)
  );

}

function saveEdit(catId,key){

  const ed=
    state.editing[catId] &&
    state.editing[catId][key];

  if(!ed) return;

  const d=state.data[catId];

  if(ed.check){

    d.checks[key]=ed.check;

  }else if(ed.list){

    Object.keys(ed.list).forEach(k=>{

      d.values[k]=ed.list[k] || '';

    });

  }else{

    d.values[key]=ed.value || '';

  }

  delete state.editing[catId][key];

  storageSet(
    'cat:'+catId,
    d
  );

  renderDetail(
    CATS.find(c=>c.id===catId)
  );

  renderHome();

  flashToast();

}

function isEditing(catId,key){

  return !!(
    state.editing[catId] &&
    state.editing[catId][key]
  );

}

function draftFor(catId,key){

  return state.editing[catId] &&
    state.editing[catId][key];

}

/* =========================================================
   PROGRESS
========================================================= */

function fieldFilled(cat,field){

  const d=state.data[cat.id];

  if(field.t==='check'){

    const c=d.checks[field.k];

    if(!c) return false;

    return (
      Object.values(c.opts || {})
        .some(Boolean)
      ||
      !!(c.other && c.other.trim())
    );

  }

  if(field.t==='list'){

    for(let i=0;i<field.n;i++){

      if(
        (
          d.values[
            field.k+'__'+i
          ] || ''
        ).trim()
      ){
        return true;
      }

    }

    return false;

  }

  return !!(
    d.values[field.k] || ''
  ).trim();

}

function catProgress(cat){

  if(cat.timeline){

    const d=state.data[cat.id];

    const filled=
      TIME_SLOTS.filter(
        t =>
          (
            d.values[
              'time__'+t
            ] || ''
          ).trim()
      ).length;

    return {
      filled,
      total:TIME_SLOTS.length
    };

  }

  const total=cat.fields.length;

  const filled=
    cat.fields.filter(
      f=>fieldFilled(cat,f)
    ).length;

  return {
    filled,
    total
  };

}

function overallProgress(){

  let filled=0;
  let total=0;

  CATS.forEach(cat=>{

    const p=catProgress(cat);

    filled+=p.filled;
    total+=p.total;

  });

  return total
    ? Math.round(
        filled/total*100
      )
    : 0;

}

/* =========================================================
   FIELD HTML
========================================================= */

function fieldHTML(cat,field){

  const d=
    state.data[cat.id];

  const editing=
    isEditing(
      cat.id,
      field.k
    );

  const ed=
    draftFor(
      cat.id,
      field.k
    );

  const value=
    editing
    ? (ed.value || '')
    : (d.values[field.k] || '');


  /* CHECK */

  if(field.t==='check'){

    const c=
      editing
      ? (
          ed.check ||
          {
            opts:{},
            other:''
          }
        )
      : (
          d.checks[field.k] ||
          {
            opts:{},
            other:''
          }
        );

    if(!editing){

      const picked=
        (field.opts || [])
          .filter(
            o =>
              c.opts &&
              c.opts[o]
          );

      if(
        c.other &&
        c.other.trim()
      ){
        picked.push(
          c.other.trim()
        );
      }

      return `

        <div class="field">

          ${questionHeader(
            field.l,
            cat.id,
            field.k
          )}

          ${
            picked.length
            ?
            `
              <div class="answer-checks">

                ${
                  picked
                    .map(
                      x =>
                        `
                          <span class="answer-chip">
                            ${escapeHTML(x)}
                          </span>
                        `
                    )
                    .join('')
                }

              </div>
            `
            :
            `
              <div class="answer-view empty">
                Belum diisi.
              </div>
            `
          }

        </div>

      `;

    }


    const chips=
      (field.opts || [])
        .map(opt=>{

          const checked=
            !!c.opts[opt];

          return `

            <label
              class="chip ${
                checked
                ? 'checked'
                : ''
              }"
            >

              <input
                type="checkbox"
                data-cat="${cat.id}"
                data-key="${escapeAttr(field.k)}"
                data-kind="draft-check-opt"
                data-opt="${escapeAttr(opt)}"
                ${checked ? 'checked' : ''}
              >

              <span class="dot"></span>

              ${escapeHTML(opt)}

            </label>

          `;

        })
        .join('');


    const otherInput=
      field.other
      ?
      `
        <input
          type="text"
          class="other-input"
          data-cat="${cat.id}"
          data-key="${escapeAttr(field.k)}"
          data-kind="draft-check-other"
          value="${escapeAttr(c.other || '')}"
          placeholder="Lainnya: tulis di sini"
        >
      `
      :
      '';


    return `

      <div class="field">

        ${questionHeader(
          field.l,
          cat.id,
          field.k
        )}

        <div class="check-grid">
          ${chips}
        </div>

        ${otherInput}

        ${editorActions(
          cat.id,
          field.k
        )}

      </div>

    `;

  }


  /* LIST */

  if(field.t==='list'){

    if(!editing){

      const rows=[];

      for(
        let i=0;
        i<field.n;
        i++
      ){

        const v=
          (
            d.values[
              field.k+'__'+i
            ] || ''
          ).trim();

        if(v){

          rows.push(`

            <div
              class="answer-view"
              style="margin-bottom:7px;"
            >
              <strong>
                ${i+1}.
              </strong>
              ${escapeHTML(v)}
            </div>

          `);

        }

      }

      return `

        <div class="field">

          ${questionHeader(
            field.l,
            cat.id,
            field.k
          )}

          ${
            rows.length
            ? rows.join('')
            :
            `
              <div class="answer-view empty">
                Belum diisi.
              </div>
            `
          }

        </div>

      `;

    }


    const rows=[];

    for(
      let i=0;
      i<field.n;
      i++
    ){

      const k=
        field.k+'__'+i;

      const v=
        ed.list
        ? (
            ed.list[k] || ''
          )
        : (
            d.values[k] || ''
          );

      rows.push(`

        <div class="list-item">

          <span class="li-num">
            ${i+1}
          </span>

          <input
            type="text"
            data-cat="${cat.id}"
            data-key="${escapeAttr(k)}"
            data-kind="draft-value"
            value="${escapeAttr(v)}"
            placeholder="Tulis di sini..."
          >

        </div>

      `);

    }

    return `

      <div class="field">

        ${questionHeader(
          field.l,
          cat.id,
          field.k
        )}

        <div class="list-items">
          ${rows.join('')}
        </div>

        ${editorActions(
          cat.id,
          field.k
        )}

      </div>

    `;

  }


  /* VIEW */

  if(!editing){

    return `

      <div class="field">

        ${questionHeader(
          field.l,
          cat.id,
          field.k
        )}

        <div
          class="answer-view ${
            value.trim()
            ? ''
            : 'empty'
          }"
        >
          ${
            value.trim()
            ? escapeHTML(value)
            : 'Belum diisi.'
          }
        </div>

      </div>

    `;

  }


  /* MONEY */

  if(field.t==='money'){

    return `

      <div class="field">

        ${questionHeader(
          field.l,
          cat.id,
          field.k
        )}

        <div class="money-wrap">

          <span>
            Rp
          </span>

          <input
            type="text"
            inputmode="numeric"
            data-cat="${cat.id}"
            data-key="${escapeAttr(field.k)}"
            data-kind="draft-value"
            value="${escapeAttr(value)}"
            placeholder="0 / bulan"
          >

        </div>

        ${editorActions(
          cat.id,
          field.k
        )}

      </div>

    `;

  }


  let cls='';

  if(field.big){
    cls+=' big';
  }

  if(field.letter){
    cls+=' letter';
  }


  /* TEXT */

  if(field.t==='text'){

    return `

      <div class="field">

        ${questionHeader(
          field.l,
          cat.id,
          field.k
        )}

        <input
          type="text"
          data-cat="${cat.id}"
          data-key="${escapeAttr(field.k)}"
          data-kind="draft-value"
          value="${escapeAttr(value)}"
          placeholder="Tulis di sini..."
        >

        ${editorActions(
          cat.id,
          field.k
        )}

      </div>

    `;

  }


  /* AREA */

  return `

    <div class="field">

      ${questionHeader(
        field.l,
        cat.id,
        field.k
      )}

      <textarea
        class="${cls.trim()}"
        data-cat="${cat.id}"
        data-key="${escapeAttr(field.k)}"
        data-kind="draft-value"
        placeholder="Tulis di sini..."
      >${escapeHTML(value)}</textarea>

      ${editorActions(
        cat.id,
        field.k
      )}

    </div>

  `;

}

          );

        const field=

          cat.fields.find(
            f =>
              f.t==='list' &&
              key.startsWith(
                f.k+'__'
              )
          )
          :
          null;


        if(field){

          ed=
            draftFor(
              catId,
              field.k
            );

          if(
            ed &&
            ed.list
          ){

            ed.list[key]=
              t.value;

          }

        }

      }

    }


    else if(
      kind==='draft-check-other'
    ){

      const catId=
        t.dataset.cat;

      const key=
        t.dataset.key;

      const ed=
        draftFor(
          catId,
          key
        );

      if(ed){

        if(!ed.check){

          ed.check={
            opts:{},
            other:''
          };

        }

        ed.check.other=
          t.value;

      }

    }

  }
);

/* =========================================================
   IMAGES
========================================================= */

function compressImage(file){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();


      reader.onload=
        ev=>{

          const img=
            new Image();


          img.onload=
            ()=>{

              const maxDim=1000;

              let w=img.width;
              let h=img.height;


              if(
                w>h &&
                w>maxDim
              ){

                h=
                  h*(maxDim/w);

                w=maxDim;

              }

              else if(
                h>maxDim
              ){

                w=
                  w*(maxDim/h);

                h=maxDim;

              }


              const canvas=
                document.createElement(
                  'canvas'
                );

              canvas.width=w;
              canvas.height=h;


              const ctx=
                canvas.getContext(
                  '2d'
                );

              ctx.drawImage(
                img,
                0,
                0,
                w,
                h
              );


              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  .72
                )
              );

            };


          img.onerror=reject;

          img.src=
            ev.target.result;

        };


      reader.onerror=reject;

      reader.readAsDataURL(file);

    }
  );

}


async function handleImages(
  catId,
  files
){

  const cat=
    CATS.find(
      c=>c.id===catId
    );


  for(
    const file of Array.from(files)
  ){

    try{

      const dataUrl=
        await compressImage(file);


      state.data[
        catId
      ].images.push({

        id:
          'img_' +
          Date.now() +
          '_' +
          Math.random()
            .toString(36)
            .slice(2,7),

        src:dataUrl

      });

    }catch(e){

      console.error(
        'Image error',
        e
      );

    }

  }


  storageSet(
    'cat:'+catId,
    state.data[catId]
  );

  renderDetail(cat);

}


function deleteImage(

){

  state.data[catId].images=

function importBackup(files){

  const file=
    files && files[0];

  if(!file) return;


  const reader=
    new FileReader();


  reader.onload=
    ev=>{

      try{

        const parsed=
          JSON.parse(
            ev.target.result
          );


        const incoming=
          parsed &&
          parsed.data
          ?
          parsed.data
          :
          parsed;


        if(
          !incoming ||
          typeof incoming!=='object'
        ){

          throw new Error(
            'format tidak dikenali'
          );

        }


        if(
          !confirm(
            'Ganti semua isian saat ini dengan isi dari file cadangan ini?'
          )
        ){

          return;

        }


        CATS.forEach(cat=>{

          const v=
            incoming[cat.id];

          state.data[cat.id]=
            v
            ? v
            : emptyData();


          storageSet(
            'cat:'+cat.id,
            state.data[cat.id]
          );

        });


        renderHome();


        alert(
          'Cadangan berhasil dimuat.'
        );


      }catch(e){

        alert(
          'File cadangan tidak bisa dibaca. Pastikan ini file cadangan dari aplikasi ini.'
        );

      }

    };


  reader.readAsText(file);

}


/* =========================================================
   STORY ENGINE
   INI BAGIAN BARU UTAMA UNTUK PDF
========================================================= */


/*
  Semua fungsi di bawah ini bertugas mengambil
  jawaban dari form lalu menjahitnya menjadi cerita.
*/


function val(catId,key){

  const d=
    state.data[catId];

  if(!d) return '';

  return (
    d.values[key] || ''
  ).trim();

}


function vals(catId,...keys){

  return keys
    .map(k=>val(catId,k))
    .filter(Boolean);

}


function checks(catId,key){

  const d=
    state.data[catId];

  if(!d) return [];

  const c=
    d.checks[key];

  if(!c) return [];

  const cat=
    CATS.find(
      x=>x.id===catId
    );

  const field=
    cat &&
    cat.fields
    ?
    cat.fields.find(
      f=>f.k===key
    )
    :
    null;

  let result=[];


  if(field && field.opts){

    result=
      field.opts.filter(
        o=>
          c.opts &&
          c.opts[o]
      );

  }


  if(
    c.other &&
    c.other.trim()
  ){

    result.push(
      c.other.trim()
    );

  }


  return result;

}


function listValues(
  catId,
  key,
  count
){

  const result=[];

  for(
    let i=0;
    i<count;
    i++
  ){

    const v=
      val(
        catId,
        key+'__'+i
      );

    if(v){
      result.push(v);
    }

  }

  return result;

}


function cleanSentence(text){

  if(!text) return '';

  let s=text.trim();

  if(!s) return '';

  s=s.replace(
    /\s+/g,
    ' '
  );

  s=s.replace(
    /[.!?]+$/g,
    ''
  );

  return s;

}


function sentence(text){

  const s=
    cleanSentence(text);

  return s
    ? s+'.'
    : '';

}


function joinNatural(arr){

  const a=
    arr
      .filter(Boolean)
      .map(x=>cleanSentence(x))
      .filter(Boolean);

  if(!a.length) return '';

  if(a.length===1){
    return a[0]+'.';
  }

  if(a.length===2){
    return a[0]+' dan '+a[1]+'.';
  }

  return (
    a.slice(0,-1).join(', ')
    +
    ', dan '
    +
    a[a.length-1]
    +
    '.'
  );

}


function paragraph(...sentences){

  return sentences
    .filter(Boolean)
    .map(s=>{

      const x=
        cleanSentence(s);

      return x
        ? x+'.'
        : '';

    })
    .filter(Boolean)
    .join(' ');

}

/* =========================================================
   STORY CHAPTER BUILDER
========================================================= */

function storyChapter(
  number,
  title,
  subtitle,
  text,
  images='',
  quote=''
){

  if(
    !text &&
    !images
  ){
    return '';
  }


  let body='';


  if(text){

    const paragraphs=
      text
        .split(/\n+/)
        .map(x=>x.trim())
        .filter(Boolean);


    if(paragraphs.length===1){

      body+=`
        <p class="story-dropcap">
          ${escapeHTML(paragraphs[0])}
        </p>
      `;

    }else{

      body+=
        paragraphs
          .map(
            p=>
              `
                <p>
                  ${escapeHTML(p)}
                </p>
              `
          )
          .join('');

    }

  }


  if(quote){

    body+=`

      <div class="story-quote">
        ${escapeHTML(quote)}
      </div>

    `;

  }


  body+=images;


  return `

    <section class="story-chapter">

      <div class="story-chapter-head">

        <div class="story-chapter-number">
          ${number}
        </div>

        <h2 class="story-chapter-title">
          ${escapeHTML(title)}
        </h2>

        ${
          subtitle
          ?
          `
            <div class="story-chapter-sub">
              ${escapeHTML(subtitle)}
            </div>
          `
          :
          ''
        }

      </div>

      <div class="story-text">
        ${body}
      </div>

    </section>

  `;

}

/* =========================================================
   UTILITIES
========================================================= */

function escapeHTML(s){

  return String(s || '')
    .replace(
      /[&<>]/g,
      m=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;'
      }[m])
    );

}


function escapeAttr(s){

  return String(s || '')
    .replace(
      /[&<>"]/g,
      m=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;'
      }[m])
    );

}
