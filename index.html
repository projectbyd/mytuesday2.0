<!DOCTYPE html>
<!--
  MY TUESDAY — 5 Tahun dari Sekarang
  ------------------------------------------------
  Aplikasi single-file (HTML + CSS + JS) berisi 18 folder pertanyaan
  refleksi diri. Semua jawaban disimpan di localStorage browser dan
  bisa diekspor menjadi cerita PDF atau file backup JSON.

  Struktur file ini:
    1. Bagian STYLE  — CSS, dibagi per bagian (lihat komentar /* ... */)
    2. Bagian BODY   — 3 wadah kosong yang diisi oleh JavaScript:
                       #homeView (halaman utama), #detailView (halaman
                       detail per folder), #printSheet (versi cetak/PDF)
    3. Bagian SCRIPT — JS, dibagi per bagian (lihat komentar // ...)
-->

<head>

<title>My Tuesday — 5 Tahun dari Sekarang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ====================================================================
 * VARIABEL WARNA & RESET DASAR
 ==================================================================== */
:root {
  --paper: #F6F1EA;
  --paper-soft: #FBF8F4;
  --ink: #2D2438;
  --ink-mute: #7A7086;
  --line: #E4DACB;
  --accent: #C65A6B;
  --accent-soft: #C65A6B22
}

* {
  box-sizing: border-box
}

html,
body {
  margin: 0;
  padding: 0
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: Karla, sans-serif;
  -webkit-tap-highlight-color: transparent
}

input,
textarea,
button {
  font-family: inherit
}

.app {
  max-width: 560px;
  margin: auto;
  min-height: 100vh;
  padding-bottom: 50px
}


/* ====================================================================
 * HALAMAN UTAMA — Hero, Progress Bar & Daftar Folder
 ==================================================================== */
.home-hero {
  padding: 38px 22px 22px;
  background: linear-gradient(180deg, #FBF8F4, var(--paper))
}

.eyebrow {
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 700;
  margin: 0 0 10px
}

.hero-title,
.detail-title {
  font-family: Fraunces, serif;
  font-weight: 600;
  letter-spacing: -.01em
}

.hero-title {
  font-size: 40px;
  line-height: 1.02;
  margin: 0 0 6px
}

.hero-sub {
  font-family: Fraunces, serif;
  font-style: italic;
  color: var(--ink-mute);
  margin: 0 0 18px
}

.hero-quote {
  font-family: Fraunces, serif;
  font-style: italic;
  font-size: 14.5px;
  line-height: 1.6;
  border-left: 2px solid var(--accent);
  padding-left: 14px;
  margin: 0
}

.hero-quote span {
  display: block;
  color: var(--ink-mute)
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 20px
}

.progress-track,
.folder-progress {
  flex: 1;
  height: 5px;
  border-radius: 5px;
  background: var(--line);
  overflow: hidden
}

.progress-fill,
.folder-progress i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #E4A339, #C65A6B, #8B4B6B, #3D3466);
  border-radius: 5px
}

.progress-label {
  font-size: 12px;
  color: var(--ink-mute);
  font-weight: 700
}

.arc-strip {
  display: flex;
  gap: 3px;
  padding: 0 22px 8px
}

.arc-dot {
  height: 4px;
  flex: 1;
  border-radius: 4px
}

.folder-list {
  padding: 6px 16px 20px
}

.folder-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  position: relative;
  overflow: hidden
}

.folder-card:before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--accent)
}

.folder-num {
  font-family: Fraunces, serif;
  font-style: italic;
  font-size: 26px;
  color: var(--accent);
  min-width: 40px
}

.folder-body {
  flex: 1
}

.folder-title {
  font-family: Fraunces, serif;
  font-weight: 600;
  font-size: 15.5px;
  margin: 0 0 3px
}

.folder-sub {
  font-size: 12px;
  color: var(--ink-mute);
  margin: 0 0 8px;
  line-height: 1.35
}

.folder-chev {
  font-size: 20px;
  color: var(--ink-mute)
}


/* ====================================================================
 * HALAMAN UTAMA — Tombol PDF, Backup & Footer
 ==================================================================== */
.pdf-row,
.backup-row {
  padding: 0 22px;
  margin-top: 10px
}

.backup-row {
  display: flex;
  gap: 10px
}

.pdf-btn,
.backup-btn {
  cursor: pointer;
  border-radius: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  font-weight: 700
}

.pdf-btn {
  width: 100%;
  border: none;
  background: var(--ink);
  color: white
}

.backup-btn {
  flex: 1;
  background: var(--paper-soft);
  color: var(--ink);
  font-size: 12px
}

.privacy-note,
.home-footer {
  text-align: center;
  color: var(--ink-mute);
  font-size: 11px;
  line-height: 1.5;
  padding: 12px 28px
}

.home-footer {
  font-family: Fraunces, serif;
  font-style: italic;
  font-size: 13.5px;
  padding-bottom: 30px
}


/* ====================================================================
 * HALAMAN DETAIL — Header & Judul Folder
 ==================================================================== */
.detail {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--paper);
  z-index: 20;
  overflow: auto
}

.detail.open {
  display: block
}

.detail-inner {
  max-width: 560px;
  margin: auto;
  padding-bottom: 60px
}

.detail-header {
  position: sticky;
  top: 0;
  background: linear-gradient(var(--paper) 70%, transparent);
  padding: 16px;
  z-index: 5;
  display: flex;
  gap: 12px;
  align-items: center
}

.back-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--paper-soft);
  font-size: 18px;
  cursor: pointer
}

.save-toast {
  opacity: 0;
  color: var(--accent);
  font-size: 12px;
  font-weight: 700
}

.save-toast.show {
  opacity: 1
}

.detail-hero {
  padding: 4px 22px 22px
}

.detail-num {
  font-family: Fraunces, serif;
  font-style: italic;
  color: var(--accent);
  margin: 0 0 6px
}

.detail-title {
  font-size: 28px;
  line-height: 1.08;
  margin: 0 0 8px
}

.detail-sub {
  font-size: 13.5px;
  color: var(--ink-mute);
  margin: 0;
  line-height: 1.5
}


/* ====================================================================
 * FORM PERTANYAAN — Field, Jawaban, Tombol Edit/Simpan
 ==================================================================== */
.section {
  padding: 0 22px 24px
}

.field {
  margin-bottom: 20px
}

.field-head {
  display: flex;
  gap: 10px;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px
}

.field-label {
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.4
}

.edit-btn,
.add-btn {
  border: 1px solid var(--line);
  background: var(--paper-soft);
  color: var(--accent);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap
}

.answer-view {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  min-height: 46px;
  line-height: 1.5;
  font-size: 15px;
  white-space: pre-wrap
}

.empty {
  color: var(--ink-mute);
  font-style: italic;
  font-size: 13px
}

input[type=text],
textarea {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--paper-soft);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 16px;
  color: var(--ink);
  resize: vertical
}

textarea {
  min-height: 76px;
  line-height: 1.5
}

.big {
  min-height: 120px
}

.letter {
  font-family: Fraunces, serif;
  font-style: italic;
  font-size: 15.5px
}

.edit-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 8px
}

.save-btn,
.cancel-btn {
  padding: 8px 12px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer
}

.save-btn {
  background: var(--accent);
  border: 1px solid var(--accent);
  color: white
}

.cancel-btn {
  background: var(--paper-soft);
  border: 1px solid var(--line);
  color: var(--ink-mute)
}


/* ====================================================================
 * CHIP — Pilihan Checklist & Tampilan Jawaban
 ==================================================================== */
.check-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px
}

.chip {
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--paper-soft);
  border-radius: 20px;
  padding: 8px 12px;
  font-size: 13px;
  cursor: pointer
}

.chip input {
  display: none
}

.chip.checked {
  background: var(--accent-soft);
  border-color: var(--accent);
  font-weight: 700
}

.answer-checks {
  display: flex;
  flex-wrap: wrap;
  gap: 7px
}

.answer-chip {
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 20px;
  padding: 7px 11px;
  font-size: 12.5px
}


/* ====================================================================
 * INPUT LIST & UANG (Rp)
 ==================================================================== */
.list-item {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px
}

.li-num {
  font-family: Fraunces, serif;
  font-style: italic;
  color: var(--accent);
  width: 18px
}

.money-wrap {
  position: relative
}

.money-wrap span {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-mute);
  font-weight: 700
}

.money-wrap input {
  padding-left: 40px
}


/* ====================================================================
 * TIMELINE — Satu Hari Biasa (Folder 13)
 ==================================================================== */
.timeline-slot {
  display: flex;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px dashed var(--line)
}

.tl-time {
  font-family: Fraunces, serif;
  font-style: italic;
  font-weight: 600;
  color: var(--accent);
  width: 52px;
  padding-top: 9px
}

.tl-input {
  flex: 1
}


/* ====================================================================
 * PERTANYAAN TAMBAHAN (Custom Question)
 ==================================================================== */
.custom-box {
  border-top: 1px solid var(--line);
  padding-top: 20px;
  margin-top: 4px
}

.custom-title {
  font-family: Fraunces, serif;
  font-style: italic;
  font-size: 17px;
  margin: 0 0 5px
}

.custom-help {
  font-size: 12px;
  color: var(--ink-mute);
  line-height: 1.5;
  margin: 0 0 12px
}

.custom-card {
  border: 1px solid var(--line);
  background: var(--paper-soft);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 10px
}

.custom-q {
  font-weight: 700;
  font-size: 13.5px;
  margin-bottom: 8px
}

.custom-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px
}

.delete-btn {
  border: 0;
  background: none;
  color: #9b5863;
  text-decoration: underline;
  font-size: 11px;
  cursor: pointer
}


/* ====================================================================
 * GALERI FOTO
 ==================================================================== */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px
}

.gal-item,
.gal-add {
  aspect-ratio: 1;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--paper-soft);
  position: relative
}

.gal-item img {
  width: 100%;
  height: 100%;
  object-fit: cover
}

.gal-del {
  position: absolute;
  right: 4px;
  top: 4px;
  border: 0;
  border-radius: 50%;
  width: 22px;
  height: 22px;
  background: #2D2438cc;
  color: white;
  cursor: pointer
}

.gal-add {
  border-style: dashed;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--ink-mute);
  cursor: pointer
}

.gal-add span {
  font-size: 20px;
  color: var(--accent)
}

input[type=file] {
  display: none
}

.danger-zone {
  text-align: center;
  padding: 10px 22px 35px
}

.danger-btn {
  border: 0;
  background: none;
  text-decoration: underline;
  color: var(--ink-mute);
  font-size: 12px;
  cursor: pointer
}


/* ====================================================================
 * MODE CETAK — Pengaturan Dasar Print/PDF
 ==================================================================== */
.print-sheet {
  display: none
}

@media print {
  body * {
    visibility: hidden
  }

  .print-sheet,
  .print-sheet * {
    visibility: visible
  }

  .print-sheet {
    display: block;
    position: absolute;
    left: 0;
    top: 0;
    width: 100%
  }

  @page {
    margin: 16mm 14mm
  }
}


/* ====================================================================
 * MODE CETAK — Halaman Cerita PDF (Sampul, Isi, Penutup)
 ==================================================================== */
.ph-cover {
  padding: 65px 0 40px;
  text-align: center;
  page-break-after: always
}

.ph-cover .eb {
  font-size: 11px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #8B4B6B;
  font-weight: 700
}

.ph-cover h1 {
  font-family: Fraunces, serif;
  font-size: 36px;
  margin: 14px 0 8px
}

.ph-cover h2 {
  font-family: Fraunces, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 17px;
  color: #7A7086
}

.ph-cover blockquote {
  font-family: Fraunces, serif;
  font-style: italic;
  line-height: 1.7;
  max-width: 420px;
  margin: 28px auto
}

.story {
  max-width: 720px;
  margin: auto
}

.story-section {
  margin-bottom: 26px;
  break-inside: avoid
}

.story-section h2 {
  font-family: Fraunces, serif;
  font-size: 22px;
  margin: 0 0 9px
}

.story-section p {
  font-family: Karla, sans-serif;
  font-size: 13.5px;
  line-height: 1.8;
  margin: 0 0 10px
}

.story-section .quote {
  font-family: Fraunces, serif;
  font-style: italic;
  font-size: 15px;
  border-left: 2px solid #C65A6B;
  padding-left: 14px
}

.story-images {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px
}

.story-images img {
  width: 110px;
  height: 110px;
  object-fit: cover;
  border-radius: 8px
}

.story-end {
  page-break-before: always;
  text-align: center;
  padding-top: 50px
}

.story-end h2 {
  font-family: Fraunces, serif;
  font-size: 28px
}

.story-end p {
  font-family: Fraunces, serif;
  font-style: italic;
  font-size: 16px;
  line-height: 1.8
}
</style>
</head>

const stops = ['#E4A339', '#C65A6B', '#8B4B6B', '#3D3466'];

function hexToRgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]
}

function lerp(a, b, t) {
  let A = hexToRgb(a),
    B = hexToRgb(b);
  return '#' + A.map((x, i) => Math.round(x + (B[i] - x) * t).toString(16).padStart(2, '0')).join('')
}
CATS.forEach((c, i) => {
  let t = i / (CATS.length - 1),
    s = t * 3,
    n = Math.min(Math.floor(s), 2);
  c.accent = lerp(stops[n], stops[n + 1], s - n)
});

const state = {
  data: {},

function emptyData() {
  return {
    values: {},
    checks: {},
    images: [],
    custom: [],
    deleted: {}
  }
}

function normalize(v) {
  return {
    values: v?.values || {},
    checks: v?.checks || {},
    images: v?.images || [],
    custom: v?.custom || [],
    deleted: v?.deleted || {}
  }
}

function loadAll() {
  CATS.forEach(c => {
    try {
      state.data[c.id] = normalize(JSON.parse(localStorage.getItem('cat:' + c.id) || 'null'))
    } catch (e) {
      state.data[c.id] = emptyData()
    }
  })
}

function saveCat(id) {
  localStorage.setItem('cat:' + id, JSON.stringify(state.data[id]));
  flashToast();
  renderHome()
}


// ======================================================================
// HELPER — escape HTML & ambil jawaban dari state
// ======================================================================
function esc(s) {
  return String(s || '').replace(/[&<>]/g, m => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;'
  } [m]))
}

function attr(s) {
  return esc(s).replace(/"/g, '&quot;')
}

function getAnswer(cat, f) {
  let d = state.data[cat.id];
  if (f.t === 'check') {
    let c = d.checks[f.k] || {},
      a = (f.opts || []).filter(o => c.opts?.[o]);
    if (c.other?.trim()) a.push(c.other.trim());
    return a.join(', ')
  }
  if (f.t === 'list') {
    return Array.from({
      length: f.n
    }, (_, i) => d.values[f.k + '__' + i]).filter(Boolean).map((x, i) => (i + 1) + '. ' + x).join('\n')
  }
  return (d.values[f.k] || '').trim()
}

function fieldFilled(c, f) {
  return !!getAnswer(c, f)
}

function catProgress(c) {
  let d = state.data[c.id];
  if (c.timeline) {
    let x = TIME_SLOTS.filter(t => (d.values['time__' + t] || '').trim()).length + (d.custom || []).filter(x => x.answer?.trim()).length;
    return {
      filled: x,
      total: TIME_SLOTS.length + (d.custom || []).length
    }
  }
  let visible = c.fields.filter(f => !d.deleted?.[f.k]),
    base = visible.filter(f => fieldFilled(c, f)).length,
    custom = (d.custom || []).filter(x => x.answer?.trim()).length;
  return {
    filled: base + custom,
    total: visible.length + (d.custom || []).length
  }
}

function overallProgress() {
  let a = 0,
    b = 0;
  CATS.forEach(c => {
    let p = catProgress(c);
    a += p.filled;
    b += p.total
  });
  return b ? Math.round(a / b * 100) : 0
}

  document.getElementById('detailView').classList.remove('open');

}

function editId(c, k) {
  return c + '::' + k
}


// ======================================================================
// MODE EDIT — mulai edit, batal, simpan jawaban
// ======================================================================
function beginEdit(cid, key) {
  let c = CATS.find(x => x.id === cid),
    d = state.data[cid],
    f = c.fields?.find(x => x.k === key);
  state.editing[editId(cid, key)] = {
    value: d.values[key] || '',
    check: JSON.parse(JSON.stringify(d.checks[key] || {
      opts: {},
      other: ''
    })),
    list: f?.t === 'list' ? Object.fromEntries(Array.from({
      length: f.n
    }, (_, i) => [key + '__' + i, d.values[key + '__' + i] || ''])) : null
  };
  renderDetail(c)
}

function cancelEdit(cid, key) {
  delete state.editing[editId(cid, key)];
  renderDetail(CATS.find(c => c.id === cid))
}

function saveEdit(cid, key) {
  let e = state.editing[editId(cid, key)],
    c = CATS.find(x => x.id === cid),
    f = c.fields?.find(x => x.k === key),
    d = state.data[cid];
  if (!e) return;
  if (f?.t === 'check') d.checks[key] = e.check;
  else if (f?.t === 'list') Object.assign(d.values, e.list);
  else d.values[key] = e.value;
  delete state.editing[editId(cid, key)];
  saveCat(cid);
  renderDetail(c)
}

function head(label, c, k) {
  return `<div class="field-head"><label class="field-label">${esc(label)}</label><div style="display:flex;gap:6px"><button class="edit-btn" onclick="beginEdit('${c}','${attr(k)}')">✎ Edit</button><button class="delete-btn" onclick="deleteBasic('${c}','${attr(k)}')">Hapus</button></div></div>`
}

function deleteBasic(cid, key) {
  if (!confirm('Hapus pertanyaan ini dari folder? Jawaban lama tetap tersimpan di backup tetapi tidak akan ditampilkan.')) return;
  state.data[cid].deleted = state.data[cid].deleted || {};
  state.data[cid].deleted[key] = true;
  saveCat(cid);
  renderDetail(CATS.find(c => c.id === cid));
  renderHome()
}

function actions(c, k) {
  return `<div class="edit-actions"><button class="cancel-btn" onclick="cancelEdit('${c}','${attr(k)}')">Batal</button><button class="save-btn" onclick="saveEdit('${c}','${attr(k)}')">✓ Save</button></div>`
}

function fieldHTML(c, f) {
  let d = state.data[c.id];
  if (d.deleted?.[f.k]) return '';
  let ed = state.editing[editId(c.id, f.k)],
    editing = !!ed,
    ans = getAnswer(c, f);
  if (!editing) return `<div class="field">${head(f.l,c.id,f.k)}<div class="answer-view ${ans?'':'empty'}">${ans?esc(ans):'Belum diisi.'}</div></div>`;
  if (f.t === 'check') {
    let chips = (f.opts || []).map(o => `<label class="chip ${ed.check.opts?.[o]?'checked':''}"><input type="checkbox" data-kind="check" data-c="${c.id}" data-k="${attr(f.k)}" data-o="${attr(o)}" ${ed.check.opts?.[o]?'checked':''}>${esc(o)}</label>`).join('');
    return `<div class="field">${head(f.l,c.id,f.k)}<div class="check-grid">${chips}</div>${f.other?`<input type="text" data-kind="other" data-c="${c.id}" data-k="${attr(f.k)}" value="${attr(ed.check.other||'')}" placeholder="Lainnya...">`:''}${actions(c.id,f.k)}</div>`
  }
  if (f.t === 'list') {
    let rows = Array.from({
      length: f.n
    }, (_, i) => `<div class="list-item"><span class="li-num">${i+1}</span><input type="text" data-kind="list" data-c="${c.id}" data-parent="${f.k}" data-k="${f.k}__${i}" value="${attr(ed.list[f.k+'__'+i]||'')}" placeholder="Tulis di sini..."></div>`).join('');
    return `<div class="field">${head(f.l,c.id,f.k)}${rows}${actions(c.id,f.k)}</div>`
  }
  let control = f.t === 'text' || f.t === 'money' ? `<input type="text" ${f.t==='money'?'inputmode="numeric"':''} data-kind="value" data-c="${c.id}" data-k="${attr(f.k)}" value="${attr(ed.value)}" placeholder="${f.t==='money'?'0 / bulan':'Tulis di sini...'}">` : `<textarea class="${f.big?'big':''} ${f.letter?'letter':''}" data-kind="value" data-c="${c.id}" data-k="${attr(f.k)}" placeholder="Tulis di sini...">${esc(ed.value)}</textarea>`;
  if (f.t === 'money') control = `<div class="money-wrap"><span>Rp</span>${control}</div>`;
  return `<div class="field">${head(f.l,c.id,f.k)}${control}${actions(c.id,f.k)}</div>`
}

function timelineHTML(c) {
  let d = state.data[c.id];
  return `<div class="section">${TIME_SLOTS.map(t=>{let k='time__'+t,e=state.editing[editId(c.id,k)],v=e?e.value:(d.values[k]||'');return`<div class="timeline-slot"><div class="tl-time">${t}</div><div class="tl-input">${e?`<textarea data-kind="value" data-c="${c.id}" data-k="${k}">${esc(v)}</textarea>${actions(c.id,k)}`:`${head('Apa yang sedang aku lakukan?',c.id,k)}<div class="answer-view ${v?'':'empty'}">${v?esc(v):'Belum diisi.'}</div>`}</div></div>`}).join('')}</div>`

function saveCustom(cid, id) {

    x = state.data[cid].custom.find(x => x.id === id);
  if (!ed || !x) return;
  x.q = ed.q.trim() || 'Pertanyaan baru';
  x.answer = ed.a;
  delete state.editing[editId(cid, 'custom:' + id)];
  saveCat(cid);
  renderDetail(CATS.find(c => c.id === cid))
}

function deleteCustom(cid, id) {
  if (!confirm('Hapus pertanyaan ini?')) return;
  state.data[cid].custom = state.data[cid].custom.filter(x => x.id !== id);
  saveCat(cid);
  renderDetail(CATS.find(c => c.id === cid));
  renderHome()
}

function renderDetail(c) {

  body += customHTML(c) + galleryHTML(c);
  document.getElementById('detailView').innerHTML = `<div class="detail-inner"><div class="detail-header"><button class="back-btn" onclick="closeDetail()">←</button><div class="save-toast" id="saveToast">Tersimpan</div></div><div class="detail-hero"><p class="detail-num">${c.num==='00'?'Sampul':c.num+' / 18'}</p><h2 class="detail-title">${c.title}</h2><p class="detail-sub">${c.sub}</p></div>${body}<div class="danger-zone"><button class="danger-btn" onclick="clearCategory('${c.id}')">Hapus isian kategori ini</button></div></div>`;

// ======================================================================
// EVENT LISTENER GLOBAL — input teks & checkbox
// ======================================================================
document.addEventListener('input', e => {
  let t = e.target,
    k = t.dataset.kind,
    c = t.dataset.c;
  if (!k || !c) return;
  if (k === 'value') {
    let ed = state.editing[editId(c, t.dataset.k)];
    if (ed) ed.value = t.value
  } else if (k === 'list') {
    let ed = state.editing[editId(c, t.dataset.parent)];
    if (ed) ed.list[t.dataset.k] = t.value
  } else if (k === 'other') {
    let ed = state.editing[editId(c, t.dataset.k)];
    if (ed) ed.check.other = t.value
  } else if (k === 'custom-q') {
    let ed = state.editing[editId(c, 'custom:' + t.dataset.id)];
    if (ed) ed.q = t.value
  } else if (k === 'custom-a') {
    let ed = state.editing[editId(c, 'custom:' + t.dataset.id)];
    if (ed) ed.a = t.value
  }
});
document.addEventListener('change', e => {
  let t = e.target;
  if (t.dataset.kind === 'check') {
    let ed = state.editing[editId(t.dataset.c, t.dataset.k)];
    ed.check.opts[t.dataset.o] = t.checked;
    renderDetail(CATS.find(c => c.id === t.dataset.c))
  }
})

// ======================================================================
// UPLOAD & KOMPRESI FOTO
// ======================================================================
function compressImage(file) {
  return new Promise((res, rej) => {
    let r = new FileReader;
    r.onload = e => {
      let i = new Image;
      i.onload = () => {
        let w = i.width,
          h = i.height,
          m = 1000;
        if (w > m || h > m) {
          let s = Math.min(m / w, m / h);
          w *= s;
          h *= s
        }
        let c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        c.getContext('2d').drawImage(i, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', .72))
      };
      i.src = e.target.result
    };
    r.onerror = rej;
    r.readAsDataURL(file)
  })
}
async function handleImages(cid, files) {
  for (let f of files) {
    try {
      state.data[cid].images.push({
        id: 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        src: await compressImage(f)
      })
    } catch (e) {}
  }
  saveCat(cid);
  renderDetail(CATS.find(c => c.id === cid))
}

function deleteImage(cid, id) {
  state.data[cid].images = state.data[cid].images.filter(x => x.id !== id);
  saveCat(cid);
  renderDetail(CATS.find(c => c.id === cid))
}

// ======================================================================
// BACKUP & IMPORT DATA (unduh/muat file JSON)
// ======================================================================
function exportBackup() {
  let b = new Blob([JSON.stringify({
      app: 'my-tuesday',
      version: 2,
      exportedAt: new Date().toISOString(),
      data: state.data
    }, null, 2)], {
      type: 'application/json'
    }),
    u = URL.createObjectURL(b),
    a = document.createElement('a');
  a.href = u;
  a.download = 'my-tuesday-cadangan-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(u)
}

function triggerImport() {
  document.getElementById('importFile').click()
}

function importBackup(files) {
  let f = files?.[0];
  if (!f) return;
  let r = new FileReader;
  r.onload = e => {
    try {
      let p = JSON.parse(e.target.result),
        incoming = p.data || p;
      if (!confirm('Ganti semua isian saat ini dengan cadangan ini?')) return;
      if (incoming.c10) {
        let a = normalize(incoming.c9),
          b = normalize(incoming.c10);
        a.values = {
          ...a.values,
          ...b.values
        };
        a.checks = {
          ...a.checks,
          ...b.checks
        };
        a.images = [...a.images, ...b.images];
        a.custom = [...a.custom, ...b.custom];
        incoming.c9 = a
      }
      CATS.forEach(c => {
        state.data[c.id] = normalize(incoming[c.id]);
        localStorage.setItem('cat:' + c.id, JSON.stringify(state.data[c.id]))
      });
      renderHome();
      alert('Cadangan berhasil dimuat. JSON dari versi lama tetap didukung.')
    } catch (err) {
      alert('File cadangan tidak bisa dibaca.')
    }
  };
  r.readAsText(f)
}


// ======================================================================
// HELPER UNTUK CERITA — ambil jawaban per kategori (val/check/list)
// ======================================================================
function isDeleted(cid, k) {
  return !!state.data[cid]?.deleted?.[k]
}

function val(cid, k) {
  return isDeleted(cid, k) ? '' : (state.data[cid]?.values?.[k] || '').trim()
}

function check(cid, k) {
  if (isDeleted(cid, k)) return '';
  let c = state.data[cid]?.checks?.[k] || {},
    a = Object.entries(c.opts || {}).filter(([, v]) => v).map(([x]) => x);
  if (c.other?.trim()) a.push(c.other.trim());
  return a.join(', ')
}

function list(cid, k) {
  if (isDeleted(cid, k)) return '';
  return Object.keys(state.data[cid]?.values || {}).filter(x => x.startsWith(k + '__')).sort().map(x => state.data[cid].values[x]).filter(Boolean).join(', ')
}

function customStory(c) {
  return (state.data[c.id].custom || []).filter(x => x.answer?.trim()).map(x => `<p><strong>${esc(x.q||'Catatan tambahan')}.</strong> ${esc(x.answer)}</p>`).join('')
}

function sec(title, texts, cid, images = false) {
  let arr = texts.filter(Boolean);
  if (!arr.length && !customStory(CATS.find(c => c.id === cid))) return '';
  let cat = CATS.find(c => c.id === cid),
    img = images ? (state.data[cid].images || []).slice(0, 6).map(i => `<img src="${i.src}">`).join('') : '';
  return `<section class="story-section"><h2 style="color:${cat.accent}">${title}</h2>${arr.map(x=>`<p>${x}</p>`).join('')}${customStory(cat)}${img?`<div class="story-images">${img}</div>`:''}</section>`
}
